name: Federated Swarm CI/CD Pipeline

on:
  push:
    branches: [ main, "sumeet/*", "janvhi/*", "sanskar/*" ]
  pull_request:
    branches: [ main ]

jobs:
  cryptographic-and-swarm-audit:
    name: Validate Cryptography, Differential Privacy & Swarm Convergence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

      - name: Run Cryptographic Security Audit
        run: |
          python scripts/run_security_audit.py

      - name: Run Swarm Benchmark Suite
        run: |
          python scripts/run_benchmarks.py
